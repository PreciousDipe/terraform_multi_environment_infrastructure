name: "Terraform Deploy (dev)"

on:
  push:
    branches:
      - "develop"
    paths-ignore:
      - "README*"
  workflow_dispatch:
    inputs:
      action:
        description: "apply (default) or plan-only"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - plan-only

permissions:
  id-token: write
  contents: read

jobs:
  networking:
    uses: ./.github/workflows/terraform.yaml
    secrets: inherit
    with:
      layer: networking
      env_key: dev
      github_environment: develop
      runner: ubuntu-latest
      apply: ${{ github.event_name == 'push' || inputs.action == 'apply' }}

  compute:
    needs: networking
    uses: ./.github/workflows/terraform.yaml
    secrets: inherit
    with:
      layer: compute
      env_key: dev
      github_environment: develop
      runner: ubuntu-latest
      apply: ${{ github.event_name == 'push' || inputs.action == 'apply' }}

  database:
    needs: compute
    uses: ./.github/workflows/terraform.yaml
    secrets: inherit
    with:
      layer: database
      env_key: dev
      github_environment: develop
      runner: ubuntu-latest
      apply: ${{ github.event_name == 'push' || inputs.action == 'apply' }}

  